name: Build Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.x   
    - name: Restore tools
      run: dotnet tool restore
    - name: Restore dependencies
      run: dotnet restore Mathemagic/Mathemagic.sln
    - name: Build
      run: dotnet build Mathemagic/Mathemagic.sln --no-restore
    - name: Unit Test
      run:  dotnet test Mathemagic/Mathemagic.sln --no-build --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=json,cobertura,lcov,teamcity,opencover
    - name: Copy Coverage to root
      run: cp Mathemagic/Mathemagic.Tests/TestResults/**/coverage.opencover.xml coverage.opencover.xml
    - name: Create Test Coverage Badge
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: simon-k/dotnet-code-coverage-badge@481191ec44286e8d401ad98797299b6226df63a6 # v1.0.0
      id: create_coverage_badge
      with:
        label: Unit Test Coverage
        color: brightgreen
        path: coverage.opencover.xml
        gist-filename: code-coverage.json
        gist-id: 9ad2229158bd5f447dc0ad93c42ae34f
        gist-auth-token: ${{ secrets.GIST_AUTH_TOKEN }}       
    - name: Mutation Test
      run: dotnet stryker
    - name: Upload Mutation Report
      uses: actions/upload-artifact@v3.0.0
      with:
        name: mutation-report
        path: StrykerOutput
    - name: Glob match
      uses: tj-actions/glob@710b1ab544f748fc0b17eb97123321e8dc8278c4 # v10
      id: glob
      with:
        files: StrykerOutput/**/reports/mutation-report.md
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      with:
        recreate: true
        path: "${{ steps.glob.outputs.paths }}" 
